name: Scraper Horarios 1ª RFEF

on:
  schedule:
    - cron: '*/15 7-21 * * *'

  workflow_dispatch:
    inputs:
      jornada:
        description: 'Número de jornada (déjalo vacío para autodetectar)'
        required: false
      dry_run:
        description: 'Solo mostrar, no escribir en Supabase'
        type: boolean
        default: false
      url_manual:
        description: 'URL de la página (opcional)'
        required: false
      imagenes_manual:
        description: 'URLs de imágenes separadas por coma (opcional)'
        required: false

jobs:
  scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests

      - name: Verificar secretos (sin mostrar su valor)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Longitud SUPABASE_URL: ${#SUPABASE_URL}"
          echo "Longitud SUPABASE_ANON_KEY: ${#SUPABASE_ANON_KEY}"
          echo "Longitud GEMINI_API_KEY: ${#GEMINI_API_KEY}"
          case "$SUPABASE_URL" in
            https://*.supabase.co) echo "SUPABASE_URL: formato correcto" ;;
            *) echo "⚠️  SUPABASE_URL: formato INESPERADO (¿vacío o mal copiado?)" ;;
          esac

      - name: Ejecutar scraper
        working-directory: scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.jornada }}" ]; then
            ARGS="--jornada ${{ github.event.inputs.jornada }}"
          else
            ARGS=""
          fi

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          if [ -n "${{ github.event.inputs.url_manual }}" ]; then
            ARGS="$ARGS --url ${{ github.event.inputs.url_manual }}"
          fi

          if [ -n "${{ github.event.inputs.imagenes_manual }}" ]; then
            ARGS="$ARGS --imagenes ${{ github.event.inputs.imagenes_manual }}"
          fi

          python scraper.py $ARGS
